site_name: Homelab Zero 2 Hero
site_description: Build a homelab from nothing, episode by episode. By Jakked Tech Bro.
site_author: Jakked Tech Bro
site_url: https://jakkedtechbro.github.io/Homelab-Zero-2-Hero/
repo_url: https://github.com/JakkedTechBro/Homelab-Zero-2-Hero
repo_name: JakkedTechBro/Homelab-Zero-2-Hero
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - callouts   # turns GitHub-style > [!TIP] callouts into Material admonitions

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Start Here:
      - Roadmap: roadmap.md
      - Glossary: reference/glossary.md
  - Episodes:
      - episodes/index.md
      - "Ep00 · Documentation setup": episodes/ep00-documentation-setup.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JakkedTechBro
    # - icon: fontawesome/brands/discord
    #   link: https://discord.gg/YOUR-INVITE
